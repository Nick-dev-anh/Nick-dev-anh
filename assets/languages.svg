<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 145" width="100%" height="145">
  <defs>
    <linearGradient id="langCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080C11"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>
    <linearGradient id="csGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" rx="4.5" width="999" height="144" fill="url(#langCardBg)" stroke="#39FF14" stroke-width="1"/>

  <!-- Title Header -->
  <g transform="translate(25, 28)">
    <circle cx="0" cy="0" r="4" fill="#39FF14"/>
    <text x="14" y="4" fill="#39FF14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
      CORE LANGUAGE &amp; DOMAIN DISTRIBUTION
    </text>
  </g>

  <!-- Progress Bar Container -->
  <g transform="translate(25, 52)">
    <!-- Base track -->
    <rect width="950" height="14" rx="7" fill="#161B22"/>

    <!-- Segments -->
    <!-- Python 50% = 475px -->
    <rect x="0" y="0" width="475" height="14" rx="7" fill="url(#pyGrad)"/>
    <!-- C# 30% = 285px -->
    <rect x="477" y="0" width="283" height="14" rx="7" fill="url(#csGrad)"/>
    <!-- SQL 12% = 114px -->
    <rect x="762" y="0" width="112" height="14" rx="7" fill="url(#sqlGrad)"/>
    <!-- Web 8% = 76px -->
    <rect x="876" y="0" width="74" height="14" rx="7" fill="url(#webGrad)"/>
  </g>

  <!-- Legend Items -->
  <g transform="translate(25, 105)">
    <!-- Item 1: Python -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="5" fill="#39FF14"/>
      <text x="18" y="9" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Python (AI &amp; Vision)</text>
      <text x="175" y="9" fill="#39FF14" font-family="'Fira Code', monospace" font-size="12" font-weight="700">50.0%</text>
    </g>

    <!-- Item 2: C# -->
    <g transform="translate(260, 0)">
      <circle cx="5" cy="5" r="5" fill="#00FF66"/>
      <text x="18" y="9" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">C# (.NET Backend)</text>
      <text x="160" y="9" fill="#00FF66" font-family="'Fira Code', monospace" font-size="12" font-weight="700">30.0%</text>
    </g>

    <!-- Item 3: SQL -->
    <g transform="translate(500, 0)">
      <circle cx="5" cy="5" r="5" fill="#A3E635"/>
      <text x="18" y="9" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SQL &amp; Architecture</text>
      <text x="160" y="9" fill="#A3E635" font-family="'Fira Code', monospace" font-size="12" font-weight="700">12.0%</text>
    </g>

    <!-- Item 4: Web -->
    <g transform="translate(740, 0)">
      <circle cx="5" cy="5" r="5" fill="#22C55E"/>
      <text x="18" y="9" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Modern Web (JS/CSS)</text>
      <text x="170" y="9" fill="#22C55E" font-family="'Fira Code', monospace" font-size="12" font-weight="700">8.0%</text>
    </g>
  </g>
</svg>
